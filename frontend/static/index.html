<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCoach AI - Smart Fitness & Performance Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --bg-dark: #090d16;
    --panel-bg: rgba(18, 25, 40, 0.75);
    --accent-emerald: #10b981;
    --accent-cyan: #06b6d4;
    --accent-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
    --user-gradient: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.08);
    --border-glow: rgba(16, 185, 129, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.08) 0%, transparent 40%);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Top App Bar / Header --- */
  header {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
  }

  .brand-icon span { font-size: 1.4rem; }

  .brand-text {
    font-weight: 800;
    font-size: 1.25rem;
    background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.25);
    padding: 0.35rem 0.85rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-emerald);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--accent-emerald);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-emerald);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  /* --- Dialogue Container --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    scroll-behavior: smooth;
  }

  /* Custom Scrollbar */
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  #log::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* Message Rows & Avatars */
  .msg-wrapper {
    display: flex;
    gap: 0.75rem;
    max-width: 85%;
    animation: slideUpFade 0.3s ease-out forwards;
  }

  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-wrapper.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-wrapper.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .msg-wrapper.agent .avatar {
    background: var(--accent-gradient);
    color: #fff;
    box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
  }

  .msg-wrapper.user .avatar {
    background: var(--user-gradient);
    color: #fff;
    box-shadow: 0 2px 10px rgba(37, 99, 235, 0.3);
  }

  .avatar span { font-size: 1.15rem; }

  .msg-body {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .msg-author {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 0.25rem;
  }

  .msg-wrapper.user .msg-author {
    text-align: right;
    margin-right: 0.25rem;
    margin-left: 0;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-wrapper.agent .bubble {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    color: var(--text-main);
    border-top-left-radius: 4px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .msg-wrapper.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 500;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
  }

  .bubble.rich {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    box-shadow: none !important;
    white-space: normal;
  }

  /* Animated Typing Indicator */
  .typing-dots {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0.5rem 0.75rem;
  }

  .typing-dots span {
    width: 7px;
    height: 7px;
    background: var(--accent-emerald);
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* --- Quick Action Suggestions Bar --- */
  .quick-chips {
    display: flex;
    gap: 0.5rem;
    padding: 0.4rem 1.5rem;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 920px;
    margin: 0 auto;
    width: 100%;
  }

  .quick-chips::-webkit-scrollbar { display: none; }

  .chip {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid var(--border);
    color: #cbd5e1;
    padding: 0.45rem 0.9rem;
    border-radius: 20px;
    font-size: 0.825rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.35rem;
    backdrop-filter: blur(8px);
  }

  .chip:hover {
    background: rgba(16, 185, 129, 0.15);
    border-color: rgba(16, 185, 129, 0.4);
    color: var(--accent-emerald);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
  }

  .chip span { font-size: 1rem; color: var(--accent-cyan); }

  /* --- Form / Input Area --- */
  form-container {
    padding: 0.75rem 1.5rem 1.25rem 1.5rem;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
  }

  form {
    display: flex;
    gap: 0.75rem;
    max-width: 920px;
    margin: 0 auto;
    position: relative;
  }

  input {
    flex: 1;
    padding: 0.9rem 1.2rem;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-main);
    outline: none;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
  }

  input::placeholder { color: #64748b; }

  input:focus {
    border-color: var(--accent-emerald);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    background: rgba(30, 41, 59, 0.9);
  }

  button {
    padding: 0.9rem 1.4rem;
    border: none;
    border-radius: 14px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    filter: brightness(1.08);
  }

  button:active { transform: translateY(0); }

  button span { font-size: 1.15rem; }

  /* --- A2UI Card & Component Themeing --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: var(--panel-bg);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(12px);
    max-width: 100%;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .a2card:hover {
    border-color: var(--border-glow);
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 800; color: #38bdf8; letter-spacing: -0.01em; margin-bottom: 0.25rem; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-bottom: 0.25rem; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 700; color: var(--accent-emerald); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; margin-top: 0.5rem; border: 1px solid var(--border); transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.01); }
  
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--accent-emerald);
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-icon">
      <span class="material-symbols-outlined">fitness_center</span>
    </div>
    <div class="brand-text">FitCoach AI</div>
  </div>
  <div class="status-badge">
    <div class="status-dot"></div>
    <span>AI Assistant Active</span>
  </div>
</header>

<div id="log"></div>

<div class="quick-chips">
  <div class="chip" onclick="sendQuick('Calculate my 1RM for bench press 200 lbs for 5 reps')">
    <span class="material-symbols-outlined">calculate</span> 1RM Calculator
  </div>
  <div class="chip" onclick="sendQuick('Show me a healthy post-workout meal recipe')">
    <span class="material-symbols-outlined">restaurant</span> Post-Workout Meal
  </div>
  <div class="chip" onclick="sendQuick('Generate a high quality image of a fitness gym setup')">
    <span class="material-symbols-outlined">image</span> Workout Image
  </div>
  <div class="chip" onclick="sendQuick('Log my workout: 3 sets of 10 squats')">
    <span class="material-symbols-outlined">edit_note</span> Log Workout
  </div>
</div>

<form-container>
  <form id="form">
    <input id="input" placeholder="Ask FitCoach AI about 1RM, workouts, recipes, or tools..." autocomplete="off" autofocus>
    <button type="submit">
      <span>send</span> Send
    </button>
  </form>
</form-container>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { 
  const e = document.createElement(tag); 
  if (cls) e.className = cls; 
  if (text != null) e.textContent = text; 
  return e; 
}

function bubble(who) {
  const wrapper = el("div", "msg-wrapper " + who);
  
  const avatar = el("div", "avatar");
  const icon = el("span", "material-symbols-outlined");
  icon.textContent = who === "user" ? "person" : "smart_toy";
  avatar.appendChild(icon);

  const body = el("div", "msg-body");
  const author = el("div", "msg-author", who === "user" ? "You" : "FitCoach AI");
  const b = el("div", "bubble");

  body.appendChild(author);
  body.appendChild(b);
  
  wrapper.appendChild(avatar);
  wrapper.appendChild(body);
  
  log.appendChild(wrapper); 
  log.scrollTop = log.scrollHeight;
  return b;
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendMessage(text) {
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); 
  b.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

function sendQuick(promptText) {
  input.value = promptText;
  sendMessage(promptText);
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  sendMessage(input.value.trim());
});

// Welcome message on load
window.addEventListener("DOMContentLoaded", () => {
  const welcomeBubble = bubble("agent");
  welcomeBubble.textContent = "Hello! I'm your FitCoach AI assistant 🏋️‍♂️\nI can calculate your 1RM & training zones, generate workout visuals, provide meal recipes, and log your fitness activities. How can I help you today?";
});
</script>
</body>
</html>
